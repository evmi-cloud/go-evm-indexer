# Regenerate with:  cd pkg/exporter/proto && buf generate
# Requires protoc-gen-go v1.35.1 (matching the rest of the repo) and
# protoc-gen-go-grpc v1.5.1 on PATH.
version: v2
inputs:
  - directory: .
plugins:
  - local: protoc-gen-go
    out: .
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: .
    opt: paths=source_relative
